# Smithery configuration file: https://smithery.ai/docs/config#smitheryyaml
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - slashmlApiKey
    properties:
      slashmlApiKey:
        type: string
        description: Your SlashML API key (sml_live_...) from https://app.slashml.ai
      slashmlUserId:
        type: string
        description: Optional default user or workspace namespace
        default: default
      slashmlAgentId:
        type: string
        description: Optional calling agent ID for per-agent read/write and redaction scoping (X-SlashML-Agent-Id)
      slashmlRedactPolicy:
        type: string
        description: Optional redaction policy preset or bucket list (tier1_secrets, soc2_coding, gdpr, hipaa, enterprise_strict)
      slashmlRedactScope:
        type: string
        description: Optional redaction scope (memorize_and_recall or recall_only)
  commandFunction:
    |-
    (config) => ({
      command: 'npx',
      args: ['-y', '@slashml/mcp'],
      env: {
        SLASHML_API_KEY: config.slashmlApiKey,
        ...(config.slashmlUserId ? { SLASHML_USER_ID: config.slashmlUserId } : {}),
        ...(config.slashmlAgentId ? { SLASHML_AGENT_ID: config.slashmlAgentId } : {}),
        ...(config.slashmlRedactPolicy ? { SLASHML_REDACT_POLICY: config.slashmlRedactPolicy } : {}),
        ...(config.slashmlRedactScope ? { SLASHML_REDACT_SCOPE: config.slashmlRedactScope } : {})
      }
    })
